name: build-release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '6.0.x'

      - name: Restore
        run: dotnet restore SmartDropZone.csproj

      - name: Build Release
        run: dotnet build SmartDropZone.csproj -c Release --no-restore

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: SmartDropZone
          path: bin/Release/net6.0-windows/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: SmartDropZone
          path: dist

      - name: Zip release
        run: |
          cd dist
          zip -r ../SmartDropZone.zip .

      - name: Get version
        id: version
        run: echo "tag=v1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # Simple, human-friendly changelog: the commit messages since the last
      # release, as plain bullets (no code links).
      - name: Build changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          {
            echo "## What's new"
            echo ""
            if [ -n "$PREV" ]; then
              git log --oneline --no-merges "$PREV"..HEAD | sed 's/^[0-9a-f]*[ ]*/- /'
            else
              git log --oneline --no-merges | sed 's/^[0-9a-f]*[ ]*/- /'
            fi
          } > /tmp/body.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SmartDropZone ${{ steps.version.outputs.tag }}
          body_path: /tmp/body.md
          files: SmartDropZone.zip
