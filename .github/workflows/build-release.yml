name: build-release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '6.0.x'

      - name: Restore
        run: dotnet restore SmartDropZone.csproj

      - name: Build Release
        run: dotnet build SmartDropZone.csproj -c Release --no-restore

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: SmartDropZone
          path: bin/Release/net6.0-windows/
