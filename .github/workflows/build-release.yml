name: build-release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore
        run: dotnet restore SmartDropZone/SmartDropZone.csproj

      - name: Build Release
        run: dotnet build SmartDropZone/SmartDropZone.csproj -c Release --no-restore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartDropZone
          path: SmartDropZone/bin/Release/net6.0-windows/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: SmartDropZone
          path: dist

      - name: Zip release
        run: |
          cd dist
          zip -r ../SmartDropZone.zip .

      - name: Get version
        id: version
        run: |
          echo "tag=v$(date +'%Y.%m.%d.%H%M')" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SmartDropZone ${{ steps.version.outputs.tag }}
          files: SmartDropZone.zip
          generate_release_notes: true