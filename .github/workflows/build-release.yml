name: build-release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '6.0.x'

      - name: Restore
        run: dotnet restore SmartDropZone.csproj

      - name: Build Release
        run: dotnet build SmartDropZone.csproj -c Release --no-restore

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: SmartDropZone
          path: bin/Release/net6.0-windows/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: SmartDropZone
          path: dist

      - name: Zip release
        run: |
          cd dist
          zip -r ../SmartDropZone.zip .

      # Simple, human-friendly changelog: commit messages since the last push,
      # as plain bullets (no code links). github.event.before is the commit that
      # was HEAD before this push (all-zero on the very first push).
      - name: Build changelog
        run: |
          PREV="${{ github.event.before }}"
          {
            echo "## What's new"
            echo ""
            if [ -n "$PREV" ] && [ "$PREV" != "0000000000000000000000000000000000000000" ]; then
              git log --oneline --no-merges "$PREV"..HEAD | sed 's/^[0-9a-f]*[ ]*/- /'
            else
              git log --oneline --no-merges | sed 's/^[0-9a-f]*[ ]*/- /'
            fi
          } > /tmp/body.md

      - name: Remove old latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --yes --cleanup-tag 2>/dev/null || true

      # One always-updated "Latest build" release. Users download from the same
      # link every time and always get the freshest binary.
      - name: Create Latest release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest build
          body_path: /tmp/body.md
          files: SmartDropZone.zip
